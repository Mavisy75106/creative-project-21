<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Pulse Dashboard</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #111128;
            --text: #c8d0e0;
            --accent: #00f0ff;
            --green: #00ff88;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            color: var(--accent);
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,240,255,0.3);
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--card);
            border-radius: 8px;
            border: 1px solid #222244;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--green);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>System Pulse</h1>
        <p>Network System Monitor Dashboard with Web Scraping</p>
        <a href="/dashboard" class="btn">Go to Dashboard</a>
        <div class="status">
            <span class="status-dot"></span>
            <span>System Online</span>
        </div>
    </div>
</body>
</html>
