<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Pulse — Scrapling 爬蟲儀表板</title>
<style>
:root {
  --bg: #0a0a1a;
  --card: #111128;
  --border: #222244;
  --text: #c8d0e0;
  --dim: #607090;
  --accent: #00f0ff;
  --green: #00ff88;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.container {
  max-width: 900px;
  padding: 40px 20px;
  text-align: center;
}
h1 {
  font-size: 48px;
  color: #fff;
  margin-bottom: 16px;
}
h1 span { color: var(--accent); }
.subtitle {
  font-size: 18px;
  color: var(--dim);
  margin-bottom: 40px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  text-align: left;
}
.card h2 {
  font-size: 18px;
  color: var(--accent);
  margin-bottom: 12px;
}
.card p {
  font-size: 14px;
  color: var(--dim);
  line-height: 1.6;
}
.btn {
  display: inline-block;
  background: var(--accent);
  color: var(--bg);
  padding: 14px 32px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.tech-stack {
  margin-top: 40px;
  padding-top: 30px;
  border-top: 1px solid var(--border);
}
.tech-stack h3 {
  color: var(--dim);
  font-size: 14px;
  margin-bottom: 16px;
}
.tags {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.tag {
  background: rgba(0, 240, 255, 0.1);
  color: var(--accent);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🔥 <span>System Pulse</span></h1>
  <p class="subtitle">Web Scraping Dashboard — Scrapling 爬蟲儀表板</p>
  
  <div class="grid">
    <div class="card">
      <h2>🔍 網頁爬蟲</h2>
      <p>使用 Scrapling 框架從 GitHub、Hacker News、Reddit、YouTube 等網站即時抓取資料</p>
    </div>
    <div class="card">
      <h2>📊 系統監控</h2>
      <p>即時監控 CPU、記憶體、磁碟、網路等系統資源使用狀況</p>
    </div>
    <div class="card">
      <h2>🏥 健康檢查</h2>
      <p>透過爬蟲技術對外部服務進行 HTTP 健康檢查與延遲測試</p>
    </div>
  </div>
  
  <a href="/dashboard" class="btn">🚀 啟動儀表板</a>
  
  <div class="tech-stack">
    <h3>技術棧</h3>
    <div class="tags">
      <span class="tag">Scrapling</span>
      <span class="tag">Flask</span>
      <span class="tag">Python 3.12</span>
      <span class="tag">CSS Grid</span>
      <span class="tag">GitHub Pages</span>
    </div>
  </div>
</div>
</body>
</html>
