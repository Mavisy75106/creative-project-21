<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Pulse — 網路系統監控儀表板</title>
<style>
:root {
  --bg: #0a0a1a;
  --card: #111128;
  --border: #222244;
  --text: #c8d0e0;
  --dim: #607090;
  --accent: #00f0ff;
  --green: #00ff88;
  --red: #ff4466;
  --yellow: #ffaa00;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}
header {
  text-align: center;
  margin-bottom: 30px;
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
}
header h1 {
  font-size: 28px;
  color: #fff;
  margin-bottom: 8px;
}
header p {
  color: var(--dim);
  font-size: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-2px); }
.card h2 {
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.metric {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.metric:last-child { border-bottom: none; }
.metric-label { color: var(--dim); font-size: 13px; }
.metric-value { color: #fff; font-weight: 600; font-size: 14px; font-family: monospace; }
.progress {
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  margin: 8px 0;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}
.status-healthy { color: var(--green); }
.status-unhealthy { color: var(--red); }
.status-error { color: var(--yellow); }
.trending-list { list-style: none; }
.trending-list li {
  padding: 10px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  font-size: 13px;
}
.trending-list li a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.trending-list li a:hover { text-decoration: underline; }
.trending-list li .stars { color: var(--dim); font-size: 12px; margin-left: 10px; }
.refresh-btn {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
}
.refresh-btn:hover { opacity: 0.8; }
.news-list { list-style: none; }
.news-list li {
  padding: 12px 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  font-size: 13px;
}
.news-list li .news-title {
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 6px;
  text-decoration: none;
}
.news-list li .news-title:hover { color: var(--accent); }
.news-list li .news-meta {
  color: var(--dim);
  font-size: 12px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.youtube-list { list-style: none; }
.youtube-list li {
  padding: 12px 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  font-size: 13px;
}
.youtube-list li .yt-title {
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 6px;
  text-decoration: none;
}
.youtube-list li .yt-title:hover { color: var(--accent); }
.youtube-list li .yt-meta {
  color: var(--dim);
  font-size: 12px;
}
#last-update {
  text-align: center;
  color: var(--dim);
  font-size: 12px;
  margin-top: 20px;
}
.search-form {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.search-form input {
  flex: 1;
  padding: 8px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.search-form input:focus { border-color: var(--accent); }
.search-form button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.search-form button:hover { opacity: 0.8; }
.subreddit-select {
  padding: 8px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔥 System Pulse</h1>
    <p>Network System Monitor Dashboard — 系統監控 + 網頁爬蟲</p>
  </header>

  <div class="grid">
    <!-- CPU -->
    <div class="card">
      <h2>📊 CPU 使用率</h2>
      <div id="cpu-metrics">
        <p style="color: var(--dim); font-size: 13px;">載入中...</p>
      </div>
    </div>

    <!-- Memory -->
    <div class="card">
      <h2>💾 記憶體使用</h2>
      <div id="memory-metrics">
        <p style="color: var(--dim); font-size: 13px;">載入中...</p>
      </div>
    </div>

    <!-- Disk -->
    <div class="card">
      <h2>💿 磁碟使用</h2>
      <div id="disk-metrics">
        <p style="color: var(--dim); font-size: 13px;">載入中...</p>
      </div>
    </div>

    <!-- Network -->
    <div class="card">
      <h2>🌐 網路介面</h2>
      <div id="network-metrics">
        <p style="color: var(--dim); font-size: 13px;">載入中...</p>
      </div>
    </div>

    <!-- Health Check -->
    <div class="card">
      <h2>🏥 服務健康檢查</h2>
      <button class="refresh-btn" onclick="checkHealth()">重新檢查</button>
      <div id="health-metrics" style="margin-top: 15px;">
        <p style="color: var(--dim); font-size: 13px;">點擊按鈕開始檢查...</p>
      </div>
    </div>

    <!-- Trending -->
    <div class="card">
      <h2>🔥 GitHub Trending</h2>
      <button class="refresh-btn" onclick="fetchTrending()">刷新趨勢</button>
      <div id="trending-metrics" style="margin-top: 15px;">
        <p style="color: var(--dim); font-size: 13px;">點擊按鈕載入趨勢...</p>
      </div>
    </div>

    <!-- Hacker News -->
    <div class="card">
      <h2>🦆 Hacker News</h2>
      <button class="refresh-btn" onclick="fetchHackerNews()">載入熱門</button>
      <div id="hn-metrics" style="margin-top: 15px;">
        <p style="color: var(--dim); font-size: 13px;">點擊按鈕載入 HN 熱門...</p>
      </div>
    </div>

    <!-- Reddit -->
    <div class="card">
      <h2>🤖 Reddit</h2>
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <select class="subreddit-select" id="reddit-subreddit">
          <option value="programming">programming</option>
          <option value="python">python</option>
          <option value="technology">technology</option>
          <option value="webdev">webdev</option>
        </select>
        <button class="refresh-btn" onclick="fetchReddit()" style="margin-top: 0;">載入熱門</button>
      </div>
      <div id="reddit-metrics" style="margin-top: 15px;">
        <p style="color: var(--dim); font-size: 13px;">選擇版區並點擊載入...</p>
      </div>
    </div>

    <!-- YouTube -->
    <div class="card">
      <h2>🎬 YouTube 搜尋</h2>
      <div class="search-form">
        <input type="text" id="yt-search" placeholder="輸入搜尋關鍵字..." value="Python 3.13">
        <button class="refresh-btn" onclick="searchYouTube()" style="margin-top: 0;">搜尋</button>
      </div>
      <div id="youtube-metrics" style="margin-top: 15px;">
        <p style="color: var(--dim); font-size: 13px;">輸入關鍵字並點擊搜尋...</p>
      </div>
    </div>
  </div>

  <div id="last-update">最後更新：載入中...</div>
</div>

<script>
async function updateSystem() {
  try {
    const res = await fetch('/api/system');
    const data = await res.json();
    
    // CPU
    document.getElementById('cpu-metrics').innerHTML = `
      <div class="metric">
        <span class="metric-label">使用率</span>
        <span class="metric-value">${data.cpu.usage_percent}%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" style="width: ${data.cpu.usage_percent}%; background: ${data.cpu.usage_percent > 80 ? 'var(--red)' : 'var(--green)'}"></div>
      </div>
      <div class="metric">
        <span class="metric-label">核心數</span>
        <span class="metric-value">${data.cpu.cores}</span>
      </div>
      <div class="metric">
        <span class="metric-label">執行時間</span>
        <span class="metric-value">${data.uptime.formatted}</span>
      </div>
    `;

    // Memory
    const memUsage = data.memory.usage_percent;
    document.getElementById('memory-metrics').innerHTML = `
      <div class="metric">
        <span class="metric-label">使用率</span>
        <span class="metric-value">${memUsage}%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" style="width: ${memUsage}%; background: ${memUsage > 80 ? 'var(--red)' : 'var(--green)'}"></div>
      </div>
      <div class="metric">
        <span class="metric-label">已使用</span>
        <span class="metric-value">${data.memory.used_gb} GB</span>
      </div>
      <div class="metric">
        <span class="metric-label">總記憶體</span>
        <span class="metric-value">${data.memory.total_gb} GB</span>
      </div>
    `;

    // Disk
    const diskUsage = data.disk.usage_percent;
    document.getElementById('disk-metrics').innerHTML = `
      <div class="metric">
        <span class="metric-label">使用率</span>
        <span class="metric-value">${diskUsage}%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" style="width: ${diskUsage}%; background: ${diskUsage > 80 ? 'var(--red)' : 'var(--green)'}"></div>
      </div>
      <div class="metric">
        <span class="metric-label">已使用</span>
        <span class="metric-value">${data.disk.used_gb} GB</span>
      </div>
      <div class="metric">
        <span class="metric-label">可用空間</span>
        <span class="metric-value">${data.disk.free_gb} GB</span>
      </div>
    `;

    // Network
    if (data.network.length > 0) {
      let netHtml = '';
      data.network.forEach(nf => {
        const rxMB = (nf.rx_bytes / 1024 / 1024).toFixed(2);
        const txMB = (nf.tx_bytes / 1024 / 1024).toFixed(2);
        netHtml += `
          <div class="metric">
            <span class="metric-label">${nf.interface}</span>
            <span class="metric-value">↓${rxMB} MB ↑${txMB} MB</span>
          </div>
        `;
      });
      document.getElementById('network-metrics').innerHTML = netHtml;
    } else {
      document.getElementById('network-metrics').innerHTML = '<p style="color: var(--dim);">無網路介面</p>';
    }

    document.getElementById('last-update').textContent = `最後更新：${new Date().toLocaleString('zh-TW')}`;
  } catch (e) {
    console.error('Update error:', e);
  }
}

async function checkHealth() {
  const res = await fetch('/api/health');
  const data = await res.json();
  let html = '';
  data.endpoints.forEach(ep => {
    const cls = ep.status === 'healthy' ? 'status-healthy' : 
                ep.status === 'error' ? 'status-error' : 'status-unhealthy';
    const icon = ep.status === 'healthy' ? '✅' : 
                 ep.status === 'error' ? '❌' : '⚠️';
    html += `<div class="metric">
      <span class="metric-label">${icon} ${ep.url}</span>
      <span class="metric-value ${cls}">${ep.latency_ms}ms</span>
    </div>`;
  });
  document.getElementById('health-metrics').innerHTML = html;
}

async function fetchTrending() {
  const res = await fetch('/api/trending?language=python');
  const data = await res.json();
  let html = '<ul class="trending-list">';
  data.repos.forEach(repo => {
    html += `<li>
      <a href="${repo.url}" target="_blank">${repo.name}</a>
      <span class="stars">${repo.stars}</span>
    </li>`;
  });
  html += '</ul>';
  html += `<p style="color: var(--dim); font-size: 11px; margin-top: 8px;">來源：${data.source}</p>`;
  document.getElementById('trending-metrics').innerHTML = html;
}

async function fetchHackerNews() {
  const res = await fetch('/api/hackernews');
  const data = await res.json();
  let html = '<ul class="news-list">';
  data.stories.forEach(story => {
    html += `<li>
      <a class="news-title" href="${story.url}" target="_blank">${story.title}</a>
      <div class="news-meta">
        <span>👤 ${story.author}</span>
        <span>👍 ${story.points}</span>
        <span>💬 ${story.comments} 則留言</span>
      </div>
    </li>`;
  });
  html += '</ul>';
  html += `<p style="color: var(--dim); font-size: 11px; margin-top: 8px;">來源：${data.source} — Hacker News Top Stories</p>`;
  document.getElementById('hn-metrics').innerHTML = html;
}

async function fetchReddit() {
  const subreddit = document.getElementById('reddit-subreddit').value;
  const res = await fetch(`/api/reddit?subreddit=${subreddit}&limit=10`);
  const data = await res.json();
  let html = '<ul class="news-list">';
  data.posts.forEach(post => {
    html += `<li>
      <a class="news-title" href="${post.url}" target="_blank">${post.title}</a>
      <div class="news-meta">
        <span>r/${post.subreddit}</span>
        <span>👤 ${post.author}</span>
        <span>👍 ${post.score}</span>
        <span>💬 ${post.comments} 則留言</span>
      </div>
    </li>`;
  });
  html += '</ul>';
  html += `<p style="color: var(--dim); font-size: 11px; margin-top: 8px;">來源：${data.source} — Reddit r/${subreddit} Hot</p>`;
  document.getElementById('reddit-metrics').innerHTML = html;
}

async function searchYouTube() {
  const query = document.getElementById('yt-search').value.trim();
  if (!query) {
    document.getElementById('youtube-metrics').innerHTML = '<p style="color: var(--yellow);">請輸入搜尋關鍵字</p>';
    return;
  }
  const res = await fetch(`/api/youtube?q=${encodeURIComponent(query)}&limit=8`);
  const data = await res.json();
  let html = '<ul class="youtube-list">';
  data.videos.forEach(video => {
    html += `<li>
      <a class="yt-title" href="${video.url}" target="_blank">${video.title}</a>
      <div class="yt-meta">📺 YouTube 搜尋結果</div>
    </li>`;
  });
  html += '</ul>';
  html += `<p style="color: var(--dim); font-size: 11px; margin-top: 8px;">來源：${data.source} — 搜尋 "${query}"</p>`;
  document.getElementById('youtube-metrics').innerHTML = html;
}

// Initial load
updateSystem();
setInterval(updateSystem, 5000);
</script>
</body>
</html>
